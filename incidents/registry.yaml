- id: scoped_event_as_process_start
  failure_mode: Scoped event lowered as a process start
  portable_seed: null
  law: >-
    An event that can fire while another stream is running is not a way the
    process begins. Lowering a scoped event listener as a start node makes the
    graph report two entry points, and no local topology mutation can repair it
    while the node's structural kind still says "start" — an annotation naming
    it an event does not reduce the start count. Extraction, naming and
    diagnosis can all be correct while the representation has no legal shape
    for the concept.
  plane: authoring
  family: representation
  parent_id: null
  portability: portable
  seed_status: seed_pending
  law_shape:
  - node_kind
  - entry_count
  - event_scope
- id: repair_claims_unearned_progress
  failure_mode: Repair claims progress it did not make
  portable_seed: null
  law: >-
    A repair aimed at a named blocker must move THAT blocker. Reporting
    "partial" because unrelated bookkeeping improved — while the target count
    is unchanged — invites the user to re-run a button the same message tells
    them not to re-run. Acceptance must also be bounded: lexicographic priority
    may decide direction, but one high-priority win must not license unlimited
    damage in lower slots.
  plane: repair
  family: repair
  parent_id: null
  portability: portable
  seed_status: runnable
  law_shape:
  - accept_vector
  - target_blocker
- id: unterminated_task_on_failure
  failure_mode: Unterminated task on failure
  portable_seed: null
  law: >-
    A handler failure must terminate its task (ABANDON) or explicitly re-arm it
    for retry. A kind whose only terminal is the success phase leaves the task
    ACTIVE forever after a failure, and every later turn is silently suppressed
    by the still-open owner — the user is refused work unrelated to the thing
    that failed.
  plane: ownership
  family: ownership
  parent_id: null
  portability: portable
  seed_status: seed_pending
  law_shape:
  - active_kind
  - terminal_phase
  - transition
- id: resume_without_rehydrate
  failure_mode: Resume without rehydrate
  portable_seed: null
  law: >-
    After disconnect / long idle / worker re-entry, the next hop must rehydrate
    View from authoritative projection (kind, phase, pins) — not cold freestyle
    over a stale ambient transcript.
  plane: ownership
  family: ownership
  parent_id: null
  portability: portable
  seed_status: seed_pending
  law_shape:
  - hydration
